openapi: 3.0.3
info:
  title: Ingredient and Dish Management API
  description: Specification to manage ingredients and dishes
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'

tags:
  - name: Ingredients
  - name: Dishes

paths:

  /ingredients:
    get:
      tags:
        - Ingredients
      summary: Get all ingredients
      description: Returns list of ingredients
      responses:
        200:
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'

  /ingredients/{id}:
    get:
      tags:
        - Ingredients
      summary: Get an ingredient by ID
      description: Returns an ingredient based on its id
      parameters:
        - $ref: '#/components/parameters/IngredientIdentifierPathParameter'
      responses:
        200:
          description: Ingredient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        404:
          description: Ingredient not found
          content:
            text/plain:
              schema:
                type: string
                example: Ingredient.id=1 is not found

  /ingredients/{id}/stock:
    get:
      tags:
        - Ingredients
      summary: Get stock value of an ingredient at a specific time
      description: Returns the stock value for the ingredient with the provided identifier at the specified time and unit
      parameters:
        - $ref: '#/components/parameters/IngredientIdentifierPathParameter'
        - $ref: '#/components/parameters/AtQueryParameter'
        - $ref: '#/components/parameters/UnitQueryParameter'
      responses:
        200:
          description: Stock value retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockValue'
        400:
          description: Missing mandatory query parameter
          content:
            text/plain:
              schema:
                type: string
                example: Either mandatory query parameter `at` or `unit` is not provided.
        404:
          description: Ingredient not found
          content:
            text/plain:
              schema:
                type: string
                example: Ingredient.id=1 is not found

  /ingredients/{id}/stockMovements:
    get:
      tags:
        - Ingredients
      summary: Get stock movements of an ingredient filtered by date range
      description: Returns a list of stock movements for the specified ingredient
      parameters:
        - $ref: '#/components/parameters/IngredientIdentifierPathParameter'
        - $ref: '#/components/parameters/FromQueryParameter'
        - $ref: '#/components/parameters/ToQueryParameter'
      responses:
        200:
          description: List of filtered stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
        404:
          description: Ingredient not found
          content:
            text/plain:
              schema:
                type: string
                example: Ingredient.id=1 is not found

    post:
      tags:
        - Ingredients
      summary: Add stock movements to an ingredient
      description: Creates a list of stock movements and associates them with the specified ingredient
      parameters:
        - $ref: '#/components/parameters/IngredientIdentifierPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StockMovementBody'
      responses:
        201:
          description: List of created stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
        400:
          description: Missing or invalid request body
          content:
            text/plain:
              schema:
                type: string
                example: Request body is mandatory
        404:
          description: Ingredient not found
          content:
            text/plain:
              schema:
                type: string
                example: Ingredient.id=1 is not found

  /dishes:
    get:
      tags:
        - Dishes
      summary: Get all dishes
      description: Returns list of dishes
      responses:
        200:
          description: List of dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'

  /dishes/{id}/ingredients:
    put:
      tags:
        - Dishes
      summary: Update ingredients associated with a dish
      description: Allows associating or dissociating a list of ingredients to the dish identified by id
      parameters:
        - $ref: '#/components/parameters/DishIdentifierPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Ingredient'
      responses:
        200:
          description: Updated dish with its ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        400:
          description: Missing request body
          content:
            text/plain:
              schema:
                type: string
                example: Request body is mandatory
        404:
          description: Dish not found
          content:
            text/plain:
              schema:
                type: string
                example: Dish.id=1 is not found

components:

  parameters:
    IngredientIdentifierPathParameter:
      in: path
      name: id
      description: Ingredient identifier
      schema:
        type: integer
      required: true

    DishIdentifierPathParameter:
      in: path
      name: id
      description: Dish identifier
      schema:
        type: integer
      required: true

    AtQueryParameter:
      in: query
      name: at
      description: Timestamp at which to retrieve the stock value
      schema:
        type: string
        format: date-time
      required: true

    UnitQueryParameter:
      in: query
      name: unit
      description: Unit of measurement for the stock
      schema:
        $ref: '#/components/schemas/UnitType'
      required: true

    FromQueryParameter:
      in: query
      name: from
      description: Start date and time for filtering
      schema:
        type: string
        format: date-time
      required: true

    ToQueryParameter:
      in: query
      name: to
      description: End date and time for filtering
      schema:
        type: string
        format: date-time
      required: true

  schemas:

    CategoryEnum:
      type: string
      enum:
        - VEGETABLE
        - ANIMAL
        - MARINE
        - DAIRY
        - OTHER

    UnitType:
      type: string
      enum:
        - KG
        - PCS
        - L

    MovementTypeEnum:
      type: string
      enum:
        - IN
        - OUT

    Ingredient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Tomato
        category:
          $ref: '#/components/schemas/CategoryEnum'
        price:
          type: number
          format: float
          example: 2.5

    StockValue:
      type: object
      properties:
        quantity:
          type: number
          format: float
          example: 15.5
        unit:
          $ref: '#/components/schemas/UnitType'

    StockMovement:
      type: object
      properties:
        id:
          type: integer
          example: 1
        creationDatetime:
          type: string
          format: date-time
          example: 2025-04-15T10:30:00Z
        unit:
          $ref: '#/components/schemas/UnitType'
        value:
          type: number
          format: float
          example: 10.0
        type:
          $ref: '#/components/schemas/MovementTypeEnum'

    StockMovementBody:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/UnitType'
        value:
          type: number
          format: float
          example: 10.0
        type:
          $ref: '#/components/schemas/MovementTypeEnum'

    Dish:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Poulet grillé
        price:
          type: number
          format: float
          example: 12.9
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'